name: Publish NAS Docker image

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'wenzong98/organize' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wenzong98/organize
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: organize:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify NAS classifier inside the image
        run: |
          docker run --rm organize:smoke --version
          docker run --rm --entrypoint python organize:smoke -c 'from pathlib import Path; from organize.filters.classify import Classify; c = Classify(categories=[{"id":"rag","folder":"RAG","strong":["RAG课程"]}]); r = c.classify(c.context(Path("/incoming/RAG课程/01.mp4"), Path("/incoming"))); assert r["category_id"] == "rag", r'

      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publication summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo '### NAS image' >> "$GITHUB_STEP_SUMMARY"
          echo '`ghcr.io/wenzong98/organize:latest`' >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo 'Platforms: linux/amd64, linux/arm64' >> "$GITHUB_STEP_SUMMARY"
          echo 'First publication defaults to private. Set the package visibility to public for anonymous NAS pulls.' >> "$GITHUB_STEP_SUMMARY"
